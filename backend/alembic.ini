# MI YONE — Alembic configuration (Phase 2 §27: versioned schema).
#
# The database URL is NOT here. alembic/env.py reads it from the same place the
# application does (MIYONE_DATABASE_URL via app.core.config.settings), so the
# migration always targets the database the app would use and no connection
# string is ever committed.
#
#   alembic upgrade head      # create / update the schema (the ONLY way in production)
#   alembic current           # which revision a database is at
#   alembic revision --autogenerate -m "describe the change"   # after editing models.py
#   alembic check             # fail if models.py and the migrations have drifted

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
